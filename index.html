<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%blobba-blob-icon-v6-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%blobba-blob-icon-v6-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%blobba-blob-icon-v6-180.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <meta name="theme-color" content="#120012" />
    <script>
      let theme = 'green'
      try {
        const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true
        const saved = standalone ? localStorage.getItem('blobba.theme.webapp.v1') : null
        if (saved === 'light' || saved === 'neon' || saved === 'neon-new' || saved === 'green') theme = saved
      } catch { /* Keep the green default when storage is unavailable. */ }
      document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'neon'
      document.documentElement.dataset.themeVariant = theme === 'green' ? 'neon-new' : theme
      document.documentElement.dataset.themeChoice = theme
      document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f75b04' : '#120012'
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, viewport-fit=cover" />
    <title>BLOBBA</title>
  </head>
  <body>
    <div class="app-neon-background" aria-hidden="true"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
