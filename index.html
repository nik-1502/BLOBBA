<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-v5-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-v5-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon-v5-180.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <meta name="theme-color" content="#120012" />
    <script>
      try {
        const storedTheme = localStorage.getItem('blobba.theme.v1')
        const theme = storedTheme === 'light' || storedTheme === 'neon' ? storedTheme : 'neon'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'neon' ? '#120012' : '#f75b04'
      } catch {
        document.documentElement.dataset.theme = 'neon'
      }
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, viewport-fit=cover" />
    <title>BLOBBA</title>
  </head>
  <body>
    <div class="app-neon-background" aria-hidden="true"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
